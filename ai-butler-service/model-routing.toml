[providers.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_ref = "qwen" # pragma: allowlist secret
region = "cn"
data_residency = "cn"

[providers.doubao]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key_ref = "doubao" # pragma: allowlist secret
region = "cn-beijing"
data_residency = "cn"

[models.qwen_balanced]
provider = "qwen"
model = "qwen3.7-plus-2026-05-26"
protocol = "openai_chat"
structured_output = true
multimodal = true
tools = true
context_window_tokens = 1000000

[embedding]
provider = "qwen"
model = "text-embedding-v4"
dimensions = 1024

[routes.conversation_router]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 512
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.intent_router]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 1024
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.availability]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 1024
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.profile]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 1024
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.goal_normalize]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 1024
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.memory_command]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 1024
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.memory_extractor]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 10000
max_input_tokens = 4000
max_output_tokens = 2048
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.research]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 30000
max_input_tokens = 12000
max_output_tokens = 8192
thinking = "enabled"
output_mode = "JSON"
requires_tools = true
max_attempts = 3

[routes.planner]
primary = "qwen_balanced"
fallbacks = []
# 首次紧凑建议最多 45 秒；仅格式错误时由节点追加一次最多 10 秒修复。
timeout_ms = 45000
max_input_tokens = 10000
max_output_tokens = 4096
thinking = "disabled"
output_mode = "JSON"
max_attempts = 2

[routes.executor]
primary = "qwen_balanced"
fallbacks = []
# Executor 采用与 Planner 相同的结构化调用边界。
timeout_ms = 45000
max_input_tokens = 10000
max_output_tokens = 4096
thinking = "disabled"
output_mode = "JSON"
max_attempts = 2

[routes.feedback_adjust]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 20000
max_input_tokens = 10000
max_output_tokens = 4096
thinking = "disabled"
output_mode = "JSON"
max_attempts = 3

[routes.response]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 20000
max_input_tokens = 8000
max_output_tokens = 8192
thinking = "disabled"
output_mode = "TEXT"
requires_structured_output = false
max_attempts = 3

[routes.multimodal]
primary = "qwen_balanced"
fallbacks = []
timeout_ms = 30000
max_input_tokens = 12000
max_output_tokens = 4096
thinking = "disabled"
output_mode = "JSON"
requires_multimodal = true
max_attempts = 3
